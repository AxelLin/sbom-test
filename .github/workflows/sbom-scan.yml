name: Daily ESP-IDF SBOM Check & Commit

on:
  schedule:
    # 每天 UTC 18:00 執行 (台灣時間凌晨 02:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write # 允許 GitHub Actions 將產生的報告 Push 回去

jobs:
  check-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 安裝 esp-idf-sbom
        run: |
          python -m pip install --upgrade pip
          pip install esp-idf-sbom

      - name: 🔍 執行 SBOM 弱點檢查並輸出報告
        continue-on-error: true 
        env:
          # 這裡嚴格保持 2 個空格的縮排，讀取你設定在 Secrets 的 API Key
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # ❗ 請務必將下方的 path/to/your/project.spdx 替換成你真實的檔案路徑
          esp-idf-sbom check proj/test.spdx.json --output-file vulnerability-report.csv

      - name: 💾 自動 Commit 並 Push 報告
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自動更新 SBOM 弱點掃描報告"
          file_pattern: vulnerability-report.csv
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
