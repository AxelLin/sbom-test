name: Daily ESP-IDF SBOM Check

on:
  schedule:
    # 每天 UTC 時間凌晨 2:00 執行 (台灣時間上午 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動觸發，方便測試

jobs:
  check-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 建議使用 3.8 以上版本

      - name: 📦 安裝 esp-idf-sbom
        run: |
          python -m pip install --upgrade pip
          pip install esp-idf-sbom

      - name: 🔍 執行 SBOM 弱點檢查並輸出報告
        # 請將 path/to/your/project.spdx 替換為你實際的 SBOM 檔案路徑
        run: |
          esp-idf-sbom check proj/test.spdx.json --output-file vulnerability-report.csv

      - name: 💾 上傳報告
        if: always() # 確保即使檢查失敗（發現漏洞）也能上傳報告
        uses: actions/upload-artifact@v4
        with:
          name: sbom-vulnerability-report
          path: vulnerability-report.csv
