name: Daily ESP-IDF SBOM Batch Check & Commit

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 安裝 esp-idf-sbom
        run: |
          python -m pip install --upgrade pip
          pip install esp-idf-sbom

      - name: 🔍 批次執行 SBOM 弱點檢查並產出報告
        continue-on-error: true 
        env:
          NVDAPIKEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # 尋找所有在 release/*/*.spdx.json 的檔案
          for sbom_file in release/*/*.spdx.json; do
            
            # 確保檔案存在 (防呆機制：如果路徑下沒有檔案，直接略過)
            [ -e "$sbom_file" ] || continue
            
            # 解析路徑 (例如：sbom_file = release/v1.0/project.spdx.json)
            dir_path=$(dirname "$sbom_file")               # 取得路徑: release/v1.0
            sub_dir=$(basename "$dir_path")                # 取得子資料夾: v1.0
            base_name=$(basename "$sbom_file" .spdx.json)  # 取得不含副檔名的檔名: project
            
            # 建立對應的輸出資料夾: scan_result/v1.0
            out_dir="scan_result/$sub_dir"
            mkdir -p "$out_dir"
            
            # 設定輸出檔案路徑: scan_result/v1.0/project-cve-report.txt
            out_file="$out_dir/${base_name}-cve-report.txt"
            
            echo "========================================="
            echo "🔎 正在掃描: $sbom_file"
            echo "📝 輸出至: $out_file"
            
            # 執行掃描指令。
            # 加上 || true 確保就算這個檔案發現漏洞 (exit code 1)，迴圈也會繼續掃描下一個檔案而不會中斷！
            esp-idf-sbom check "$sbom_file" --output-file "$out_file" || true
            
          done

      - name: 💾 自動 Commit 並 Push 報告
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自動更新 SBOM 批次掃描報告"
          # 這裡改成掃描整個 scan_result 資料夾底下的所有變動
          file_pattern: 'scan_result/**'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
